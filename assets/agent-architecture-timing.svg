@media(prefers-color-scheme:dark){.canvas{fill:#0d1117}.primary{fill:#f0f6fc}.secondary{fill:#8c959f}.grid{stroke:#30363d}.frame{stroke:#484f58}.reference{stroke:#8c959f}.failure{stroke:#f85149}.selected-ring{stroke:#0d1117}.vm0-fill{fill:#58a6ff}.vm0-stroke{stroke:#58a6ff}.vm1-fill{fill:#bc8cff}.vm1-stroke{stroke:#bc8cff}.vm2-fill{fill:#d29922}.vm2-stroke{stroke:#d29922}.vm3-fill{fill:#f0883e}.vm3-stroke{stroke:#f0883e}.vm4-fill{fill:#3fb950}.vm4-stroke{stroke:#3fb950}.vm5-fill{fill:#39c5cf}.vm5-stroke{stroke:#39c5cf}}
</style>

