<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Architecture commits early; performance matures later</title>
  <desc id="desc">By checkpoint four, all 20 interpreter-start runs had introduced a working compiler, while the median run had reached 65% of its eventual best performance.</desc>
  <style>
.canvas{fill:#fff}.primary{fill:#24292f}.secondary{fill:#57606a}.grid{stroke:#d8dee4}.frame{stroke:#afb8c1}.reference{stroke:#6e7781}.failure{stroke:#cf222e}.selected-ring{stroke:#fff}.vm0-fill{fill:#0969da}.vm0-stroke{stroke:#0969da}.vm1-fill{fill:#8250df}.vm1-stroke{stroke:#8250df}.vm2-fill{fill:#bf8700}.vm2-stroke{stroke:#bf8700}.vm3-fill{fill:#bc4c00}.vm3-stroke{stroke:#bc4c00}.vm4-fill{fill:#1a7f37}.vm4-stroke{stroke:#1a7f37}.vm5-fill{fill:#0a7c86}.vm5-stroke{stroke:#0a7c86}
