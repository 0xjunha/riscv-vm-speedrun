<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 495" role="img" aria-labelledby="title desc">
<title id="title">RISC-V Reference VMs: Performance and Agent Effort</title>
<desc id="desc">Dual-axis chart comparing VM0 through VM5 performance relative to x86-64 native execution across 15 application workloads and the Codex agent-hours used to implement and optimize each VM.</desc>
<style>
text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.title { fill: #252a2d; font-size: 26px; font-weight: 600; letter-spacing: -0.4px; }
.subtitle { fill: #6d7478; font-size: 14px; font-weight: 400; }
.config { fill: #6d7478; font-size: 11px; font-weight: 500; }
.axis { fill: #6d7478; font-size: 11px; font-weight: 500; }
.performance-axis-title { fill: #2a78d6; font-size: 11px; font-weight: 600; }
.effort-axis-title { fill: #252a2d; font-size: 11px; font-weight: 600; }
.vm { fill: #252a2d; font-size: 15px; font-weight: 600; }
.architecture { fill: #6d7478; font-size: 12px; font-weight: 400; }
.implementation { fill: #252a2d; font-size: 13px; font-weight: 600; }
.value { fill: #2a78d6; font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
.baseline { fill: #6d7478; font-size: 10px; font-weight: 500; }
.barvalue { fill: #252a2d; font-size: 11px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
</style>
<rect width="720" height="495" fill="#ffffff"/>
