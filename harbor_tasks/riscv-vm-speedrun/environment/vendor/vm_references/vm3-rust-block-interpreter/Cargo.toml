[package]
name = "rv32vm-rust-block-interpreter"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[[bin]]
name = "rv32vm"
path = "src/main.rs"

[dependencies]
rv32vm-rust-common = { path = "../rust-interpreter-common" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
