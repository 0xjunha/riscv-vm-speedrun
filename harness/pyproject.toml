[project]
name = "rv32im-harness"
version = "0.1.0"
description = "Conformance and benchmarking harness for RV32IM VM implementations"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rv32im-benchmark = "rv32im_harness.benchmark:main"
rv32im-conformance = "rv32im_harness.conformance:main"
rv32im-contract = "rv32im_harness.contract_runner:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
